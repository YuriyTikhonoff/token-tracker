[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "token-tracker"
version = "0.1.0"
description = "Claude Code (and Codex) token usage and cost, per project, session and account, read from your own local logs."
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
]

[project.urls]
Homepage = "https://github.com/YuriyTikhonoff/token-tracker"
Issues = "https://github.com/YuriyTikhonoff/token-tracker/issues"

[project.scripts]
token-tracker = "token_tracker.cli:main"

[tool.setuptools.packages.find]
include = ["token_tracker*"]

[tool.setuptools.package-data]
token_tracker = ["pricing.json", "widget.html", "static/**/*"]
